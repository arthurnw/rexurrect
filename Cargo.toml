[package]
name = "rexurrect"
version = "0.1.0"
edition = "2024"
description = "Save Rex sessions and recreate them after the Rex server stops"
license = "MIT"
repository = "https://github.com/cemcatik/rexurrect"
readme = "README.md"
publish = false

[[bin]]
name = "rexurrect"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
